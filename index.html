<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Unit 12 Project</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
  
    <h1>Minecraft Quiz</h1>
    <hr />
    <!-- Creeper Question -->
    <form id="Mob1-form">
      <label>
        👾Which mob was created from a glitch?
        <select id="Mob1-answer">
          <option value="Mob1">Enderman</option>
          <option value="Mob2">Ocelot</option>
          <option value="Mob3">Frog</option>
          <option value="Mob4">Creeper</option>
        </select>
      </label>
      <button type="submit">Check Answer</button>
    </form>
    <div id="Mob1-result">
      <p id="Mob1-text"></p>
    </div>
    <hr />
    <!-- Mushroom soup Question -->
    <form id="Mob2-form">
      <label>
       🍄 What do you get from a Mooshroom Cow?
        <select id="Mob2-answer">
          <option value="Mob5">Mushroom soup</option>
          <option value="Mob6">Milk</option>
          <option value="Mob7">Mycelium</option>
          <option value="Mob8">All of the Above</option>
        </select>
      </label>
      <button type="submit">Check Answer</button>
    </form>
    <div id="Mob2-result">
      <p id="Mob2-text"></p>
    </div>
    <hr />
    <!-- Endermites Question -->
    <form id="Mob3-form">
      <label>
       🎆 What mob is an Enderman Afraid of?
        <select id="Mob3-answer">
          <option value="Mob9">Ender Dragon</option>
          <option value="Mob10">Water</option>
          <option value="Mob11">Endermites</option>
          <option value="Mob12">Squids</option>
        </select>
      </label>
      <button type="submit">Check Answer</button>
    </form>
    <div id="Mob3-result">
      <p id="Mob3-text"></p>
    </div>
    <hr />
    <!-- Endermites Question -->
    <form id="Mob4-form">
      <label>
       What effect do you get from Dolphins?
        <select id="Mob4-answer">
          <option value="Mob13">Underwater Breathing</option>
          <option value="Mob14">Grace</option>
          <option value="Mob15">Mining Fatigue</option>
          <option value="Mob16">Poisoning</option>
        </select>
      </label>
      <button type="submit">Check Answer</button>
    </form>
    <div id="Mob4-result">
      <p id="Mob4-text"></p>
    </div>
    
    
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
    <script>
      
      //========================Creeper Question jQuery Code
      $("#Mob1-form").on("submit", function (event) {
        event.preventDefault();

        var $answer = $("#Mob1-answer");
        var answer = $answer.val();

        if (answer === "Mob4") {
          $("#Mob1-text").text("YESSSS!");
        } 
        else {
          $("#Mob1-text").text("Try Again!");
        }
      });

      //=======================Mushroom soup Question jQuery Code
      $("#Mob2-form").on("submit", function (event) {
        event.preventDefault();

        var $answer = $("#Mob2-answer");
        var answer = $answer.val();

        if (answer === "Mob5") {
          $("#Mob2-text").text("YESSSS!");
        } 
        else {
          $("#Mob2-text").text("Try Again!");
        }
      });

       //=======================Endermites Question jQuery Code
      $("#Mob3-form").on("submit", function (event) {
        event.preventDefault();

        var $answer = $("#Mob3-answer");
        var answer = $answer.val();

        if (answer === "Mob11") {
          $("#Mob3-text").text("YESSSS!");
        } 
        else {
          $("#Mob3-text").text("Try Again!");
        }
      });

       //=======================Mushroom soup Question jQuery Code
      $("#Mob4-form").on("submit", function (event) {
        event.preventDefault();

        var $answer = $("#Mob4-answer");
        var answer = $answer.val();

        if (answer === "Mob14") {
          $("#Mob4-text").text("YESSSS!");
        } 
        else {
          $("#Mob4-text").text("Try Again!");
        }
      });
      
    </script>
  </body>

  <!--- Taken From Khan Academy HTML/JS: Making webpages interactive with jQuery-->
</html>
